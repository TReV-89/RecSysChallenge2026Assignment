[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talkplay-recommender"
version = "0.1.0"
description = "A local-first TalkPlay music recommendation prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "chromadb>=1.0,<2",
  "datasets>=3.6,<5",
  "fastapi>=0.115,<1",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-groq>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "numpy>=2.2,<3",
  "pandas>=2.3,<4",
  "pyarrow>=20,<30",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sentence-transformers>=5.0,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4,<5"]

[project.scripts]
talkplay-ingest = "music_recommender.ingest:main"
talkplay-evaluate = "music_recommender.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
